[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygpgpu"
version = "0.1.0"
description = "Import GPU kernels like Python functions across OpenCL / CUDA / HIP backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Time-Coder" }]
keywords = ["gpu", "opencl", "cuda", "hip", "rocm", "kernel", "jit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26",
    "imageio>=2.30",
    "tree-sitter>=0.21",
    "tree-sitter-opencl>=0.1",
    "tree-sitter-cuda>=0.1",
    # pygpgpu/__init__.py imports pygf for the numpy.array monkey-patch and re-exports its
    # vector types, so it is a hard requirement rather than an optional extra.
    "pygf",
]

[project.urls]
Homepage = "https://github.com/Time-Coder/PyGPGPU"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.60",
]

[tool.setuptools.packages.find]
include = ["pygpgpu*"]

[tool.setuptools.package-data]
pygpgpu = ["**/*.pyi", "**/*.pyi.in"]

# ---------------------------------------------------------------------------
# ruff -- Python static checks (lint). Run: python -m ruff check
#   Legacy sources inside pygpgpu, auto-generated .pyi stubs and the vendored
#   pcpp code are excluded from checking; see extend-exclude and per-file-ignores.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    # auto-generated / regenerated on demand by the import hooks -- never hand-edit
    "**/*.pyi",
    # vendored third-party preprocessor
    "pygpgpu/cparser/pcpp",
    # legacy cparser: not imported at runtime (cparser.csyntaxtree/ctokens/ShaderBuiltins, ...)
    "pygpgpu/cparser/cparser.py",
    "pygpgpu/cparser/minifyc.py",
    "pygpgpu/cparser/csyntaxtree.py",
    "pygpgpu/cparser/ctokens.py",
    "pygpgpu/cparser/ShaderBuiltins.py",
]

[tool.ruff.lint]
# Start from the ruff defaults (E4/E7/E9 + F). Wider sets (I/UP/B/SIM) surface far more
# pre-existing violations than this codebase currently satisfies, so they are left out
# until that backlog is worked through.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Bare `except` is deliberate in two shapes:
    #  - the ctypes error-code wrapper (driver/*.py) converts a return value and swallows
    #    conversion failures, then reports through CL.check_error;
    #  - __repr__ fallbacks must never raise.
    # Besides, the ctypes bindings raise plain exceptions at the FFI boundary, so a narrow
    # `except SomeError` would be wrong there.
    "E722",
    # `l` (local id) is the conventional name for a work-item's local index, `i/j/k` are
    # taken by indices in the same expressions: e.g. `l = gpu.get_local_id(0)`.
    "E741",
    # `from numpy import *` re-exports the numpy surface as pygpgpu.numpy (gnp).
    "F403",
    "F405",
]

# re-export style __init__.py (public aggregation for driver/vector types): F401 unused imports are fine
[tool.ruff.lint.per-file-ignores]
"pygpgpu/**/__init__.py" = ["F401"]
# Generated vector-type module: its hex-digit table maps both 'A'..'F' and 'a'..'f'; ruff's
# F601 reports these as repeated keys because it compares case-insensitively, which is a false
# positive. The file is produced from templates, so edit the template, not this file.
"pygpgpu/vec_types/genVec*.py" = ["F601"]
# This example installs the .cl import hook on purpose before importing the kernel module,
# so the `import vecadd` cannot sit at the top of the file.
"examples/06_handwritten_kernels.py" = ["E402"]

# ---------------------------------------------------------------------------
# ty -- Python type checking. Run: python -m ty check
#   Auto-generated .pyi stubs, the vendored pcpp and the legacy cparser sources
#   are skipped at the file-discovery stage via src.exclude (src.exclude only
#   takes effect during discovery, unlike overrides.trim.globs which change rules).
# ---------------------------------------------------------------------------
[tool.ty]
environment.python-version = "3.12"
# pygf lives in a sibling checkout on this machine, so it is not on the default module search
# path even though it is installed. `pip install pygf` makes this unnecessary.
environment.extra-paths = ["../pygf"]
src.exclude = [
    # auto-generated stubs
    "**/*.pyi",
    # vendored third-party preprocessor
    "pygpgpu/cparser/pcpp/**",
    # legacy cparser sources, not imported at runtime
    "pygpgpu/cparser/cparser.py",
    "pygpgpu/cparser/minifyc.py",
    "pygpgpu/cparser/csyntaxtree.py",
    "pygpgpu/cparser/ctokens.py",
    "pygpgpu/cparser/ShaderBuiltins.py",
    # one-off development script (no module imports it): it fetches the vendor headers over the
    # network via requests/bs4 to regenerate the atom-type tables. Not part of the runtime, and
    # its third-party deps are deliberately not required by this package.
    "pygpgpu/cparser/generate_code.py",
    # ctypes binding layer. These modules build call signatures from the runtime's function
    # tables (dynamically created restype/argtypes, pointer arithmetic over ctypes buffers), so
    # the checker cannot model them and reports thousands of invalid-argument-type /
    # not-subscriptable diagnostics that do not correspond to real defects. What can be checked
    # statically -- the kernel translator, the work-size heuristics and the vector types -- is
    # kept in scope.
    "pygpgpu/**/driver/**",
]

# Diagnostics raised through inference the checker cannot follow are silenced rather than
# warned: leaving 400+ warnings in the output hides the handful that matter. What is silenced is
# limited to the ctypes-facing OOP layer and the pygf-native vector types, whose members are
# resolved at runtime. The rules that indicate a real defect -- calling/iterating/subscripting a
# None, an out-of-range index, an invalid type form -- remain errors and fail the run.
[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
no-matching-overload = "ignore"
invalid-explicit-override = "ignore"
invalid-parameter-default = "ignore"
too-many-positional-arguments = "ignore"
call-non-callable = "ignore"
index-out-of-bounds = "ignore"

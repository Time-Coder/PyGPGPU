[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygpgpu"
version = "0.1.0"
description = "Import GPU kernels like Python functions across OpenCL / CUDA / HIP backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Time-Coder" }]
keywords = ["gpu", "opencl", "cuda", "hip", "rocm", "kernel", "jit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26",
    "imageio>=2.30",
    "tree-sitter>=0.21",
    "tree-sitter-opencl>=0.1",
    "tree-sitter-cuda>=0.1",
]

[project.urls]
Homepage = "https://github.com/Time-Coder/PyGPGPU"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["pygpgpu*"]

[tool.setuptools.package-data]
pygpgpu = ["**/*.pyi", "**/*.pyi.in"]
